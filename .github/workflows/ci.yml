name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dependencies
        run: npm ci
      - name: Validate icons
        run: npm run icons:verify
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked
